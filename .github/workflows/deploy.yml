name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: |
          if [ -z "$NEXT_PUBLIC_TBANK_FUNDRAISER_URL" ]; then
            echo "Set the TBANK_FUNDRAISER_URL repository variable in GitHub Actions."
            exit 1
          fi
          npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /donation_landing
          NEXT_PUBLIC_TBANK_FUNDRAISER_URL: ${{ vars.TBANK_FUNDRAISER_URL }}

      - name: Keep Next.js assets on GitHub Pages
        run: touch out/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
